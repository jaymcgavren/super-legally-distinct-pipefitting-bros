# RuboCop for a wasmcart-mruby game. Run: rubocop
#
# The game (app/) runs on mruby 3.4, not CRuby: it has no `defined?`, no
# Struct keyword_init, no `case/in`, and calls are slow enough that the hot
# paths use plain positional methods and operators. So prefer cops that
# keep the code plain, and turn off the ones that would swap an operator
# for a method call every frame. tools/ is CRuby (tests, bots, generators).

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'wasmcart-mruby/**/*'
    - 'node_modules/**/*'
    - 'build/**/*'
    - 'vendor/**/*'
    - 'app/levels.rb'   # generated by tools/gen-levels.rb

# ── game-shaped code ───────────────────────────────────────────────
# Step methods (a move, a scene, an ending phase) read best whole. Tools
# are one-off scripts (bots, generators, a reachability search) whose main
# loop reads best whole too, so the size limits are for the game only.
Metrics/MethodLength:
  Max: 45
  CountAsOne: ['array', 'hash', 'heredoc', 'method_call']
  Exclude: ['tools/**/*']
Metrics/AbcSize:
  Max: 60
  Exclude: ['tools/**/*']
Metrics/CyclomaticComplexity:
  Max: 20
  Exclude: ['tools/**/*']
Metrics/PerceivedComplexity:
  Max: 20
  Exclude: ['tools/**/*']
Metrics/ClassLength:
  Max: 700   # Game is the world: level, player, enemies, items, drawing
Metrics/ModuleLength:
  Max: 200
Metrics/ParameterLists:
  Max: 8     # x, y, w, h, colour, alpha... drawing takes a lot
  CountKeywordArgs: false   # Screen#sprite's optional flip:/alpha:/angle:
Metrics/BlockLength:
  Exclude:
    - 'tools/**/*'
# A ternary picking a speed inside an if/elsif counts as a level; four is fine.
Metrics/BlockNesting:
  Max: 4
# The methods over these limits carry a `rubocop:todo` on their def line:
# they are candidates to split, not rules to relax for everything.

# x, y, w, h, c(olumn), r(ow), dx, vy... are the clearest names in math.
Naming/MethodParameterName:
  MinNameLength: 1

Layout/LineLength:
  Max: 130
  AutoCorrect: false   # its wrapping is hard to read; wrap by hand

# `n > 0` is an operator; `n.positive?` is a method call every frame.
Style/NumericPredicate:
  Enabled: false

# mruby has no use for the magic comment.
Style/FrozenStringLiteralComment:
  Enabled: false

# Comments sit where the code is; no class doc header required.
Style/Documentation:
  Enabled: false

# ── tests and tools ────────────────────────────────────────────────
# Scenario and tool scripts are terse on purpose: several steps on a line,
# and `check 'name', a.all? { ... }` reads fine.
Style/Semicolon:
  Exclude:
    - 'tools/**/*'
Lint/AmbiguousBlockAssociation:
  Exclude:
    - 'tools/scenarios/**/*'
# `check 'name', list.any? { ... }` must keep its braces: as do/end the
# block would bind to `check` and the test would always pass.
Style/BlockDelimiters:
  Exclude:
    - 'tools/scenarios/**/*'
# Tool scripts are named like the shell tools beside them (gen-levels.rb).
Naming/FileName:
  Exclude:
    - 'tools/gen-levels.rb'

# ── house style ────────────────────────────────────────────────────
# Arithmetic like `x + w / 2` reads fine without extra brackets.
Lint/AmbiguousOperatorPrecedence:
  Enabled: false
# Guard clauses stay tight against the code they guard.
Layout/EmptyLineAfterGuardClause:
  Enabled: false
# Small helper classes live next to the class that uses them
# (effects.rb, boss.rb's shots).
Style/OneClassPerFile:
  Enabled: false
# `update` on items, enemies and the wrench returns whether it can be
# touched; renaming it `update?` would read worse.
Naming/PredicateMethod:
  Enabled: false

# ── mruby ──────────────────────────────────────────────────────────
# `class X < Struct.new(...)`: constants in a `Struct.new do` block land at
# top level in mruby, so subclassing is the way to give a Struct constants.
Style/StructInheritance:
  Enabled: false
# Keyword arguments are slow in mruby; hot paths use positional ones.
Style/OptionalBooleanParameter:
  Enabled: false
# Comparable#clamp raises when min > max; the camera's bounds can cross on
# a short level, which the min/max form handles.
Style/ComparableClamp:
  Enabled: false
# `[a, b].max` allocates an array; the ternary doesn't.
Style/MinMaxComparison:
  Enabled: false
# The runtime calls the top-level `tick`, which keeps the game in $game;
# the scenarios count failures in $fails and find their test in $scenario.
Style/GlobalVars:
  AllowedVariables: ['$game', '$fails', '$scenario']
# wasmcart-mruby's require takes the packed path, extension included.
Style/RedundantFileExtensionInRequire:
  Exclude:
    - 'app/**/*'
# Trailing comments line up in columns in the tables and constant blocks.
Layout/ExtraSpacing:
  AllowBeforeTrailingComments: true
# Short nested ternaries pick a value in one line of maths (shake jitter,
# firework cadence); unrolled into if/else they read worse.
Style/NestedTernaryOperator:
  Enabled: false
# `[6, 7].include?(x)` allocates an array; `x == 6 || x == 7` doesn't.
Style/MultipleComparison:
  Enabled: false
